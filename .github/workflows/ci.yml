name: Native macOS
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    outputs:
      tested_commit:
        description: Commit built and tested on macOS
        value: ${{ jobs.build.outputs.tested_commit }}
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    outputs:
      tested_commit: ${{ steps.revision.outputs.sha }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata and source boundary
        run: |
          /usr/bin/python3 native/scripts/release.py check
          /usr/bin/python3 native/scripts/public-source.py audit .
      - name: Build with the pinned engine (no Apple account)
        run: native/scripts/dev.sh --build-only
      - name: State checks
        run: native/scripts/check.sh
