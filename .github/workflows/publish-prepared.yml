name: Publish verified macOS update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing browser tag with a prepared draft release
        required: true
        type: string
      source_run_id:
        description: Optional successful Native macOS push run for this tag's exact main commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'tiff75009/arcreborn' && !inputs.source_run_id
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: refs/tags/${{ inputs.tag }}
  publish:
    needs: source
    if: >-
      ${{ !cancelled() && github.repository == 'tiff75009/arcreborn' &&
          (needs.source.result == 'success' || (inputs.source_run_id != '' && needs.source.result == 'skipped')) }}
    # Validation checks signatures and tickets without executing the arm64 app.
    runs-on: macos-26-intel
    environment: release
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version tag
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+",os.environ["TAG"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate reviewed sources
        run: |
          /usr/bin/python3 native/scripts/release.py check
          /usr/bin/python3 native/scripts/public-source.py audit .
          /usr/bin/python3 -c 'import json,os; assert os.environ["TAG"] == "v"+json.load(open("native/Resources/ReleaseNotes.json"))["version"]'
      - name: Verify the tag still points to the tested commit
        env:
          TESTED_SHA: ${{ needs.source.outputs.tested_commit }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          run_id = os.environ["SOURCE_RUN"]
          if not run_id:
              assert head == os.environ["TESTED_SHA"], "Tag differs from freshly tested commit"
          else:
              assert re.fullmatch(r"[0-9]+", run_id), "Invalid run ID"
              repo = os.environ["GITHUB_REPOSITORY"]
              def api(path):
                  return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/{path}"]))
              run = api(f"runs/{run_id}")
              assert run["workflow_id"] == api("workflows/ci.yml")["id"]
              assert run["head_repository"]["full_name"] == repo
              assert (run["head_sha"], run["head_branch"], run["event"]) == (head, "main", "push")
              assert (run["status"], run["conclusion"]) == ("completed", "success")
              jobs = api(f"runs/{run_id}/attempts/{run['run_attempt']}/jobs")["jobs"]
              required = {"Build with the pinned engine (no Apple account)", "State checks", "Validate release metadata and source boundary"}
              assert any(job["name"] == "build" and job["conclusion"] == "success" and "macos-26" in job["labels"]
                         and required <= {s["name"] for s in job["steps"] if s["conclusion"] == "success"} for job in jobs)
              print(f"Verified arm64 build and tests: https://github.com/{repo}/actions/runs/{run_id}")
          PYTHON
      - name: Download prepared release
        run: |
          mkdir -p "$RUNNER_TEMP/arc-release-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/arc-release-assets" \
            --pattern 'ArcReborn-*-macos-arm64.dmg' --pattern appcast.xml --pattern release.json --pattern SHA256SUMS
      - name: Verify checksums and version
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          assets=Path(os.environ['RUNNER_TEMP'])/'arc-release-assets'
          notes=json.loads(Path('native/Resources/ReleaseNotes.json').read_text())
          release=json.loads((assets/'release.json').read_text())
          engine=json.loads(Path('native/Engine/engine.lock.json').read_text())
          assert release == {'version':notes['version'],'build':notes['build'],'engine':engine['version']}
          expected={f"ArcReborn-{notes['version']}-macos-arm64.dmg",'appcast.xml','release.json'}
          checked=set()
          for line in (assets/'SHA256SUMS').read_text().splitlines():
              digest,name=line.split('  ',1)
              assert name in expected and name not in checked and re.fullmatch('[0-9a-f]{64}',digest)
              assert hashlib.sha256((assets/name).read_bytes()).hexdigest() == digest
              checked.add(name)
          assert checked == expected
          PY
          xcrun swift native/scripts/verify-release.swift native/Resources/Info.plist "$RUNNER_TEMP/arc-release-assets"
      - name: Verify Apple signature and notarization
        run: |
          assets="$RUNNER_TEMP/arc-release-assets"
          dmg="$assets/ArcReborn-${TAG#v}-macos-arm64.dmg"
          mount="$RUNNER_TEMP/arc-release-mount"
          mkdir -p "$mount"
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$dmg"
          trap 'hdiutil detach "$mount" || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict "$mount/Arc Reborn.app"
          xcrun stapler validate "$mount/Arc Reborn.app"
          spctl --assess --type execute --verbose=2 "$mount/Arc Reborn.app"
          /usr/bin/python3 - "$mount/Arc Reborn.app/Contents/Info.plist" <<'PY'
          import plistlib,sys
          expected=plistlib.load(open('native/Resources/Info.plist','rb'))
          actual=plistlib.load(open(sys.argv[1],'rb'))
          for key in ['CFBundleIdentifier','CFBundleVersion','CFBundleShortVersionString','SUPublicEDKey']:
              assert actual[key] == expected[key], key
          assert not actual.get('ArcRebornDevelopmentBuild',False)
          PY
      - name: Publish update and changelog
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published Arc Reborn ${TAG#v}: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
